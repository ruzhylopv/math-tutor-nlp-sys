name: address-review

# When the developer submits "Request changes" on a PR, or a "Comment" review whose body starts with
# /address-review (GitHub does not let authors request changes on their own PRs), Claude Code fixes
# the requested changes on that PR's branch. Runs only for ruzhylopv, on same-repo PRs. Never merges.
on:
  pull_request_review:
    types: [submitted]

concurrency:
  group: address-review-${{ github.event.pull_request.number }}
  cancel-in-progress: false

jobs:
  address-review:
    if: >-
      (github.event.review.state == 'changes_requested' ||
        (github.event.review.state == 'commented' &&
          startsWith(github.event.review.body, '/address-review'))) &&
      github.event.review.user.login == 'ruzhylopv' &&
      github.event.pull_request.head.repo.full_name == github.repository
    runs-on: ubuntu-latest
    timeout-minutes: 20
    permissions:
      contents: write
      pull-requests: write
      issues: write
      id-token: write # the action exchanges an OIDC token for its GitHub access token
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.head.ref }}
          fetch-depth: 0

      - uses: astral-sh/setup-uv@v5

      - run: uv sync

      # The agent gets no `gh api`. This step fetches only the triggering review and its top-level
      # inline comments (replies inside existing threads are ignored) with the workflow's own calls,
      # and checks the author.
      - name: Fetch the triggering review
        env:
          GH_TOKEN: ${{ github.token }}
          PR: ${{ github.event.pull_request.number }}
          REVIEW_ID: ${{ github.event.review.id }}
        run: |
          mkdir -p .review-context
          base="repos/$GITHUB_REPOSITORY/pulls/$PR/reviews/$REVIEW_ID"
          gh api "$base" --jq '{id, author: .user.login, state, body}' > .review-context/review.json
          jq -e '.author == "ruzhylopv"' .review-context/review.json > /dev/null
          gh api "$base/comments?per_page=100" \
            --jq '[.[] | select(.in_reply_to_id == null) | {id, path, line, original_line, author: .user.login, body}]' \
            > .review-context/comments.json

      - uses: anthropics/claude-code-action@v1
        with:
          claude_code_oauth_token: ${{ secrets.CLAUDE_CODE_OAUTH_TOKEN }}
          prompt: |
            Run the address-review skill for pull request #${{ github.event.pull_request.number }}
            in ${{ github.repository }}. The triggering review is in .review-context/review.json and
            its inline comments are in .review-context/comments.json; use only those files.
            Follow CLAUDE.md. Do not merge. Do not touch other branches.
          claude_args: |
            --max-turns 10
            --allowedTools "Read,Edit,Write,Grep,Glob,Bash(uv run pytest:*),Bash(uv run ruff:*),Bash(uv run mypy:*),Bash(git status),Bash(git diff:*),Bash(git log:*),Bash(git add:*),Bash(git commit:*),Bash(git push),Bash(git push origin HEAD),Bash(gh pr comment:*)"
            --disallowedTools "Bash(gh pr merge:*),Bash(gh api:*),Bash(gh pr view:*),Bash(gh pr diff:*),Bash(git push --force:*),Bash(git push -f:*),Bash(git push --force-with-lease:*),Bash(git push --delete:*),Bash(git push * main),Bash(git push *:main),Bash(git push +*),Edit(./.claude/**),Write(./.claude/**),Edit(./.github/**),Write(./.github/**),Edit(./CLAUDE.md),Write(./CLAUDE.md)"

      # The agent writes .review-context/replies.json; this step, not the agent, posts the replies.
      # The allowed comment ids are re-fetched here with the workflow's own call, not read from a file
      # the agent could have edited, so replies can only go to this review's top-level comments.
      - name: Post per-thread replies
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
          PR: ${{ github.event.pull_request.number }}
          REVIEW_ID: ${{ github.event.review.id }}
        run: |
          f=.review-context/replies.json
          if [ ! -f "$f" ]; then echo "No replies.json, nothing to post."; exit 0; fi
          jq -e 'type == "array"' "$f" > /dev/null
          allowed=$(gh api "repos/$GITHUB_REPOSITORY/pulls/$PR/reviews/$REVIEW_ID/comments?per_page=100" \
            --jq '[.[] | select(.in_reply_to_id == null) | .id]')
          total=$(jq 'length' "$f")
          if [ "$total" -gt 50 ]; then echo "::warning::replies.json has $total entries; only 50 are considered"; fi
          replies=$(jq -c --argjson allowed "$allowed" '
            [.[] | select(type == "object")]
            | unique_by(.comment_id)
            | .[:50][]
            | select((.comment_id | type) == "number" and (.comment_id | floor) == .comment_id
                     and (.comment_id | IN($allowed[])))
            | select(.status == "done" or .status == "not_done")
            | {comment_id: (.comment_id | floor | tostring),
               status,
               commit: (if ((.commit // "") | tostring | test("^[0-9a-f]{7,40}$")) then (.commit | tostring) else "" end),
               text: ((.text // "") | tostring | .[:1000]
                      | gsub("@"; "@​") | gsub("#(?<d>[0-9])"; "#​\(.d)")
                      | gsub("!\\["; "[") | gsub("\\]\\("; "] ("))}' "$f")
          failed=0
          while IFS= read -r reply; do
            [ -n "$reply" ] || continue
            id=$(jq -r '.comment_id' <<< "$reply")
            commit=$(jq -r '.commit' <<< "$reply")
            if [ -n "$commit" ] && ! git cat-file -e "${commit}^{commit}" 2> /dev/null; then commit=""; fi
            if [ "$(jq -r '.status' <<< "$reply")" = "done" ]; then label="Done"; else label="Not done"; fi
            if [ -n "$commit" ]; then label="$label in $commit"; fi
            body="$label: $(jq -r '.text' <<< "$reply")"
            if ! gh api -X POST "repos/$GITHUB_REPOSITORY/pulls/$PR/comments/$id/replies" -f body="$body" > /dev/null; then
              echo "::warning::reply to comment $id failed"
              failed=1
            fi
          done <<< "$replies"
          exit "$failed"
