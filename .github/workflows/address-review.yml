name: address-review

# When the developer submits "Request changes" on a PR, or a "Comment" review whose body starts with
# /address-review (GitHub does not let authors request changes on their own PRs), Claude Code fixes
# the requested changes on that PR's branch. Runs only for ruzhylopv, on same-repo PRs. Never merges.
on:
  pull_request_review:
    types: [submitted]

concurrency:
  group: address-review-${{ github.event.pull_request.number }}
  cancel-in-progress: false

jobs:
  address-review:
    if: >-
      (github.event.review.state == 'changes_requested' ||
        (github.event.review.state == 'commented' &&
          startsWith(github.event.review.body, '/address-review'))) &&
      github.event.review.user.login == 'ruzhylopv' &&
      github.event.pull_request.head.repo.full_name == github.repository
    runs-on: ubuntu-latest
    timeout-minutes: 20
    permissions:
      contents: write
      pull-requests: write
      issues: write
      id-token: write # the action exchanges an OIDC token for its GitHub access token
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.head.ref }}
          fetch-depth: 0

      - uses: astral-sh/setup-uv@v5

      - run: uv sync

      # The agent gets no `gh api`. This step fetches only the triggering review and its top-level
      # inline comments (replies inside existing threads are ignored) with the workflow's own calls,
      # and checks the author.
      - name: Fetch the triggering review
        env:
          GH_TOKEN: ${{ github.token }}
          PR: ${{ github.event.pull_request.number }}
          REVIEW_ID: ${{ github.event.review.id }}
        run: |
          mkdir -p .review-context
          base="repos/$GITHUB_REPOSITORY/pulls/$PR/reviews/$REVIEW_ID"
          gh api "$base" --jq '{id, author: .user.login, state, body}' > .review-context/review.json
          jq -e '.author == "ruzhylopv"' .review-context/review.json > /dev/null
          gh api "$base/comments?per_page=100" \
            --jq '[.[] | select(.in_reply_to_id == null) | {id, path, line, original_line, author: .user.login, body}]' \
            > .review-context/comments.json

      - uses: anthropics/claude-code-action@v1
        with:
          claude_code_oauth_token: ${{ secrets.CLAUDE_CODE_OAUTH_TOKEN }}
          prompt: |
            Run the address-review skill for pull request #${{ github.event.pull_request.number }}
            in ${{ github.repository }}. The triggering review is in .review-context/review.json and
            its inline comments are in .review-context/comments.json; use only those files.
            Follow CLAUDE.md. Do not merge. Do not touch other branches.
          claude_args: |
            --max-turns 10
            --allowedTools "Read,Edit,Write,Grep,Glob,Bash(uv run:*),Bash(git status),Bash(git diff:*),Bash(git log:*),Bash(git add:*),Bash(git commit:*),Bash(git push),Bash(git push origin:*),Bash(gh pr view:*),Bash(gh pr diff:*),Bash(gh pr comment:*)"
            --disallowedTools "Bash(gh pr merge:*),Bash(gh api:*),Bash(git push --force:*),Bash(git push -f:*)"

      # The agent writes .review-context/replies.json; this step, not the agent, posts the replies.
      # Only replies to comments in comments.json are posted, so the agent cannot reach other threads.
      - name: Post per-thread replies
        env:
          GH_TOKEN: ${{ github.token }}
          PR: ${{ github.event.pull_request.number }}
        run: |
          f=.review-context/replies.json
          if [ ! -f "$f" ]; then echo "No replies.json, nothing to post."; exit 0; fi
          jq -e 'type == "array"' "$f" > /dev/null
          allowed=$(jq -c '[.[].id]' .review-context/comments.json)
          jq -c --argjson allowed "$allowed" '
            .[:50][]
            | select((.comment_id | type) == "number" and (.comment_id | IN($allowed[])))
            | select(.status == "done" or .status == "not_done")
            | {comment_id,
               body: ((if .status == "done" then "Done" else "Not done" end)
                 + (if (.commit // "" | test("^[0-9a-f]{7,40}$")) then " in " + .commit else "" end)
                 + ": " + ((.text // "") | tostring | .[:1000] | gsub("@"; "@\u200b")))}' "$f" |
          while IFS= read -r reply; do
            id=$(jq -r '.comment_id' <<< "$reply")
            body=$(jq -r '.body' <<< "$reply")
            gh api -X POST "repos/$GITHUB_REPOSITORY/pulls/$PR/comments/$id/replies" -f body="$body" > /dev/null
          done
