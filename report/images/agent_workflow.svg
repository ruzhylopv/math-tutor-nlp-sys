<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1000 560" width="1000" height="560" font-family="-apple-system, 'Segoe UI', Helvetica, Arial, sans-serif">
  <defs>
    <marker id="a" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M0,0 L10,5 L0,10 z" fill="#37474f"/>
    </marker>
    <style>
      .t { font-size: 14px; font-weight: 600; fill: #1b1b1b; }
      .s { font-size: 11.5px; fill: #37474f; }
      .e { font-size: 11.5px; fill: #263238; font-style: italic; }
      .edge { stroke: #37474f; stroke-width: 1.6; fill: none; marker-end: url(#a); }
      .dev { fill: #e3f2fd; stroke: #1565c0; stroke-width: 1.6; }
      .agt { fill: #ede7ff; stroke: #6b4fd8; stroke-width: 1.6; }
      .sub { fill: #fff3e0; stroke: #ef6c00; stroke-width: 1.6; }
      .gate { fill: #e6f4ea; stroke: #2e7d32; stroke-width: 1.6; }
      .gh { fill: #eceff1; stroke: #546e7a; stroke-width: 1.6; }
    </style>
  </defs>
  <rect width="1000" height="560" fill="#ffffff"/>
  <text x="20" y="28" class="t" font-size="16">How a change reaches main</text>

  <!-- legend -->
  <g transform="translate(560,14)">
    <rect x="0" y="0" width="13" height="13" rx="3" class="dev"/><text x="19" y="11" class="s">developer</text>
    <rect x="90" y="0" width="13" height="13" rx="3" class="agt"/><text x="109" y="11" class="s">main agent</text>
    <rect x="190" y="0" width="13" height="13" rx="3" class="sub"/><text x="209" y="11" class="s">subagent</text>
    <rect x="280" y="0" width="13" height="13" rx="3" class="gate"/><text x="299" y="11" class="s">automatic gate</text>
    <rect x="0" y="20" width="13" height="13" rx="3" class="gh"/><text x="19" y="31" class="s">GitHub (PR, Actions)</text>
  </g>

  <!-- row 1 -->
  <rect x="20" y="70" width="170" height="78" rx="10" class="dev"/>
  <text x="105" y="94" text-anchor="middle" class="t">Request + plan</text>
  <text x="105" y="113" text-anchor="middle" class="s">agent proposes a plan;</text>
  <text x="105" y="128" text-anchor="middle" class="s">developer approves in chat</text>
  <text x="105" y="143" text-anchor="middle" class="s">→ docs/plans/…</text>

  <path d="M190,109 H222" class="edge"/>
  <rect x="224" y="70" width="180" height="78" rx="10" class="agt"/>
  <text x="314" y="94" text-anchor="middle" class="t">Branch or stack</text>
  <text x="314" y="113" text-anchor="middle" class="s">feat/ fix/ docs/ …;</text>
  <text x="314" y="128" text-anchor="middle" class="s">gh stack: one concern</text>
  <text x="314" y="143" text-anchor="middle" class="s">per layer</text>

  <path d="M404,109 H436" class="edge"/>
  <rect x="438" y="70" width="190" height="78" rx="10" class="agt"/>
  <text x="533" y="94" text-anchor="middle" class="t">Implement</text>
  <text x="533" y="113" text-anchor="middle" class="s">node contract, prompts in .md,</text>
  <text x="533" y="128" text-anchor="middle" class="s">SymPy for all math, tests</text>
  <text x="533" y="143" text-anchor="middle" class="s">with a mocked LLM</text>

  <path d="M628,109 H660" class="edge"/>
  <rect x="662" y="70" width="318" height="78" rx="10" class="gate"/>
  <text x="821" y="94" text-anchor="middle" class="t">Hooks and permissions</text>
  <text x="821" y="113" text-anchor="middle" class="s">ruff after every edit · no commit/push on main ·</text>
  <text x="821" y="128" text-anchor="middle" class="s">ruff + mypy + pytest before the agent may stop ·</text>
  <text x="821" y="143" text-anchor="middle" class="s">test split, .env, merge, force-push denied</text>

  <!-- down to open-pr -->
  <path d="M821,148 V196" class="edge"/>
  <rect x="662" y="198" width="318" height="64" rx="10" class="agt"/>
  <text x="821" y="222" text-anchor="middle" class="t">open-pr skill</text>
  <text x="821" y="241" text-anchor="middle" class="s">push the branch(es), draft PR(s) from the template</text>
  <text x="821" y="256" text-anchor="middle" class="s">(plan, state fields, tests, eval, decisions)</text>

  <!-- review loop -->
  <path d="M662,230 H600" class="edge"/>
  <rect x="300" y="190" width="298" height="80" rx="10" class="sub"/>
  <text x="449" y="214" text-anchor="middle" class="t">code-reviewer (one per layer)</text>
  <text x="449" y="233" text-anchor="middle" class="s">own worktree, in parallel; runs the gate;</text>
  <text x="449" y="248" text-anchor="middle" class="s">grades P0-P3 against CLAUDE.md, lists</text>
  <text x="449" y="263" text-anchor="middle" class="s">possible over-engineering separately</text>

  <path d="M300,230 H228" class="edge"/>
  <text x="264" y="222" text-anchor="middle" class="e">P0 / P1</text>
  <rect x="20" y="190" width="206" height="80" rx="10" class="sub"/>
  <text x="123" y="214" text-anchor="middle" class="t">review-fixer</text>
  <text x="123" y="233" text-anchor="middle" class="s">fixes blockers only, one commit;</text>
  <text x="123" y="248" text-anchor="middle" class="s">"Not fixed" is escalated;</text>
  <text x="123" y="263" text-anchor="middle" class="s">no second review pass</text>

  <path d="M123,270 V318" class="edge"/>
  <path d="M449,270 V300 H180 V318" class="edge"/>
  <text x="330" y="294" class="e">P2 / P3 / over-engineering: listed, not fixed</text>
  <rect x="20" y="320" width="330" height="64" rx="10" class="gh"/>
  <text x="185" y="344" text-anchor="middle" class="t">Review comment on the PR</text>
  <text x="185" y="363" text-anchor="middle" class="s">fixed findings with commits; P2, P3 and simplifications</text>
  <text x="185" y="378" text-anchor="middle" class="s">for the developer to decide; gate results</text>

  <!-- developer review -->
  <path d="M350,352 H398" class="edge"/>
  <rect x="400" y="320" width="230" height="64" rx="10" class="dev"/>
  <text x="515" y="344" text-anchor="middle" class="t">Developer reviews on GitHub</text>
  <text x="515" y="363" text-anchor="middle" class="s">from any device, no IDE needed</text>
  <text x="515" y="378" text-anchor="middle" class="s">only the developer merges</text>

  <path d="M630,352 H690" class="edge"/>
  <text x="660" y="342" text-anchor="middle" class="e">changes</text>
  <rect x="692" y="306" width="288" height="98" rx="10" class="gh"/>
  <text x="836" y="330" text-anchor="middle" class="t">address-review GitHub Action</text>
  <text x="836" y="349" text-anchor="middle" class="s">"Request changes" or a /address-review comment</text>
  <text x="836" y="364" text-anchor="middle" class="s">→ Claude Code on the PR branch, developer-only,</text>
  <text x="836" y="379" text-anchor="middle" class="s">no gh api, no merge; the workflow (not the agent)</text>
  <text x="836" y="394" text-anchor="middle" class="s">posts a "Done / Not done" reply in each thread</text>

  <path d="M836,404 V440 H580 V386" class="edge"/>
  <text x="708" y="456" text-anchor="middle" class="e">new commits on the same PR</text>

  <path d="M450,384 V470" class="edge"/>
  <rect x="400" y="472" width="230" height="44" rx="10" class="dev"/>
  <text x="515" y="499" text-anchor="middle" class="t">merge to main (developer)</text>

  <text x="20" y="536" class="s">Context the agent always has: CLAUDE.md (rules), docs/architecture.md, docs/decisions.md (choices and rejected alternatives),</text>
  <text x="20" y="552" class="s">docs/crisp_dm_log.md, docs/plans/, and a persistent memory of the developer's preferences.</text>
</svg>
